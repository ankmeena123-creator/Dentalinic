<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dentalinic | Multi-Specialty Dental Clinic Gurugram</title>
    <meta name="description" content="Dentalinic — Multi-Specialty Dental Clinic in Gurugram, Delhi. Modern dentistry, compassionate care, and personalized treatment plans under one roof." />
    <meta property="og:title" content="Dentalinic — Healthy Smiles. Confident You." />
    <meta property="og:description" content="Multi-Specialty Dental Clinic in Gurugram, Delhi. Modern technology, ethical care, and transparent treatment plans." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // GitHub Pages trailing slash normalization
      // Ensures relative assets resolve correctly if accessed without trailing slash
      (function() {
        var path = window.location.pathname;
        if (path.length > 1 && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-sky-500 selection:text-white">
    <div id="root">
      <div id="app-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0f172a; text-align: center; padding: 24px;">
        <div style="width: 44px; height: 44px; border: 3px solid #e2e8f0; border-top-color: #0284c7; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: #0f172a;">Dentalinic</div>
        <div style="font-size: 13px; color: #64748b; margin-top: 4px;">Loading clinic experience...</div>
        <div id="preloader-help" style="display: none; margin-top: 24px; max-width: 440px; font-size: 13px; color: #475569; line-height: 1.5; background: #ffffff; padding: 16px; border-radius: 12px; border: 1px solid #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
          <div style="font-weight: 600; color: #0f172a; margin-bottom: 6px;">Taking longer than expected?</div>
          If you are viewing this on GitHub Pages, verify that your repository Settings &rarr; Pages is set to <strong>GitHub Actions</strong> or try refreshing.
          <div style="margin-top: 12px;">
            <a href="javascript:window.location.reload(true)" style="display: inline-block; padding: 6px 14px; background: #0284c7; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 500; font-size: 12px;">Reload Page</a>
          </div>
        </div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <script>
        setTimeout(function() {
          var help = document.getElementById('preloader-help');
          if (help) help.style.display = 'block';
        }, 4000);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
